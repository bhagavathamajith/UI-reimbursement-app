<div class="container">
  <h2 class="form-title">Submit Receipt for Reimbursement</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label>Date:</label><br>
      <input type="date" formControlName="date"><br><br>
    </div>
    <div>
      <label>Amount:</label><br>
      <input type="number" step="0.01" formControlName="amount"><br><br>
    </div>
    <div>
      <label>Description:</label><br>
      <textarea formControlName="description"></textarea><br><br>
    </div>
    <div>
      <label>Upload Receipt:</label><br>
      <input type="file" (change)="onFileChange($event)" required><br><br>
    </div>
    <button type="submit" [disabled]="form.invalid">Submit</button>

    <div *ngIf="submitted">
      <p *ngIf="success" style="color: green;">Receipt submitted successfully!</p>
      <p *ngIf="!success" style="color: red;">{{ errorMsg }}</p>
    </div>
  </form>
</div>
